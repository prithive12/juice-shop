name: DSO Lab - Security Scans

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: SCA - npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate dependency audit report
        run: npm audit --json > npm-audit.json || true

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 7

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan source code
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            semgrep/semgrep:latest \
            semgrep scan --config auto \
            --json --output /src/semgrep-report.json /src

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: warn
          retention-days: 7

  gitleaks:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  container-scan:
    name: Container Security - Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build Juice Shop image
        run: |
          docker build \
            -t juice-shop-dso-lab:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: juice-shop-dso-lab:${{ github.sha }}
          format: json
          output: trivy-image-report.json
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-report
          path: trivy-image-report.json
          if-no-files-found: warn
          retention-days: 7

  dast-zap:
    name: DAST - OWASP ZAP Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build Juice Shop image
        run: |
          docker build -t juice-shop-dso-lab:${{ github.sha }} .

      - name: Create isolated Docker network
        run: docker network create dso-zap

      - name: Start Juice Shop
        run: |
          docker run -d --name juice-shop \
            --network dso-zap \
            --network-alias juice-shop \
            juice-shop-dso-lab:${{ github.sha }}

      - name: Wait for Juice Shop
        run: |
          docker run --rm --network dso-zap \
            --entrypoint sh curlimages/curl:latest -c '
              i=0
              while [ "$i" -lt 30 ]; do
                if curl -fsS http://juice-shop:3000/ >/dev/null; then
                  echo "Juice Shop is ready"
                  exit 0
                fi
                i=$((i + 1))
                sleep 2
              done
              echo "Juice Shop failed to become ready"
              exit 1
            '

      - name: Prepare writable ZAP report directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/zap-output"
          chmod 777 "$GITHUB_WORKSPACE/zap-output"

      - name: Run ZAP baseline scan
        run: |
          docker run --rm \
            --network dso-zap \
            -v "$GITHUB_WORKSPACE/zap-output:/zap/wrk/:rw" \
            --workdir /zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://juice-shop:3000 \
            -m 2 -I \
            -r zap-report.html \
            -J zap-report.json

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-baseline-report
          path: |
            zap-output/zap-report.html
            zap-output/zap-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Clean up DAST containers
        if: always()
        run: |
          docker rm -f juice-shop 2>/dev/null || true
          docker network rm dso-zap 2>/dev/null || true
